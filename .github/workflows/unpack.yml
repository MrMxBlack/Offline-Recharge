name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for z in *.zip; do
            rm -rf _tmp
            unzip -oq "$z" -d _tmp
            d=$(ls -d _tmp/*/ | head -1)
            rsync -a --exclude .github "$d" ./
            rm -rf _tmp "$z"
          done
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Unpack project" || true
          git push
